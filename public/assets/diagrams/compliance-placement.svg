<text x="260" y="245" class="lbl" text-anchor="middle">Accounting software</text>
<text x="260" y="266" class="sub" text-anchor="middle">invoicing · VAT · ledger</text>
<line x1="260" y1="176" x2="260" y2="207" class="flow" marker-end="url(#complianceplacement-headInk)"/>
<rect x="68" y="328" width="384" height="68" rx="8" class="boxDashed" stroke-dasharray="7 5"/>
<text x="260" y="357" class="lbl" text-anchor="middle">Separate e-invoicing tool</text>
<text x="260" y="378" class="sub" text-anchor="middle">another vendor · another cost</text>
<line x1="260" y1="284" x2="260" y2="319" class="flow" stroke-dasharray="6 5" marker-end="url(#complianceplacement-headMuted)"/>
<line x1="260" y1="396" x2="260" y2="447" class="flow" stroke-dasharray="6 5" marker-end="url(#complianceplacement-headMuted)"/>
<rect x="544" y="64" width="472" height="536" rx="12" class="panelB"/>
<text x="780" y="100" class="panelTitleBrand" text-anchor="middle">Vithean</text>
<rect x="588" y="128" width="384" height="48" rx="8" class="boxNeutral"/>
<text x="780" y="158" class="lbl" text-anchor="middle">Your business</text>
<line x1="780" y1="176" x2="780" y2="207" class="flow" marker-end="url(#complianceplacement-headInk)"/>
<rect x="588" y="216" width="384" height="180" rx="8" class="boxBrand"/>
<text x="780" y="250" class="lblBrand" text-anchor="middle">Vithean</text>
<text x="780" y="274" class="sub" text-anchor="middle">invoicing · VAT · ledger</text>
<line x1="620" y1="308" x2="940" y2="308" class="divider"/>
<text x="780" y="340" class="lbl" text-anchor="middle">CamInv connection built in</text>
<text x="780" y="364" class="sub" text-anchor="middle">one system · one login · one record</text>
<line x1="780" y1="396" x2="780" y2="447" class="flowBrand" marker-end="url(#complianceplacement-headBrand)"/>
<rect x="68" y="456" width="384" height="56" rx="8" class="boxGov"/>
<text x="260" y="480" class="lblGov" text-anchor="middle">CamInv</text>
<text x="260" y="499" class="subGov" text-anchor="middle">Ministry of Economy and Finance</text>
<rect x="588" y="456" width="384" height="56" rx="8" class="boxGov"/>
<text x="780" y="480" class="lblGov" text-anchor="middle">CamInv</text>
<text x="780" y="499" class="subGov" text-anchor="middle">Ministry of Economy and Finance</text>
<rect x="68" y="532" width="384" height="48" rx="6" class="bandA"/>
<text x="260" y="553" class="band" text-anchor="middle">↑  Status comes back separately</text>
<text x="260" y="570" class="bandSub" text-anchor="middle">matched to your books by hand</text>
<rect x="588" y="532" width="384" height="48" rx="6" class="bandB"/>
<text x="780" y="553" class="bandBrand" text-anchor="middle">↑  Status returns to the same record</text>
<text x="780" y="570" class="bandSub" text-anchor="middle">with the official XML and PDF</text>
<text x="24" y="38" class="figTitle">Where compliance sits</text>
<text x="520" y="638" class="caption" text-anchor="middle">Both routes can produce a compliant invoice. The difference is how many systems have to agree — and who keeps them agreeing.</text>
</svg>
