<text x="42" y="196" class="ss">ក្នុង វិធាន</text>
<text x="42" y="212" class="ss">ដូចដែលអ្នកធ្វើស្រាប់</text>
<line x1="244" y1="170" x2="257" y2="170" class="arw" marker-end="url(#caminvflowkm-hd)"/>
<rect x="272" y="118" width="214" height="104" rx="9" class="card"/>
<text x="290" y="145" class="num">២</text>
<text x="290" y="174" class="st">វិធាន ផ្ញើវាទៅ</text>
<text x="290" y="196" class="ss">CamInv ពីឯកសារ</text>
<text x="290" y="212" class="ss">ដដែលនោះ</text>
<line x1="492" y1="170" x2="505" y2="170" class="arw" marker-end="url(#caminvflowkm-hd)"/>
<rect x="520" y="118" width="214" height="104" rx="9" class="cardGov"/>
<text x="538" y="145" class="numGov">៣</text>
<text x="538" y="174" class="st">CamInv អនុញ្ញាត</text>
<text x="538" y="196" class="ss">ផ្ទៀងផ្ទាត់ និងអនុញ្ញាត</text>
<text x="538" y="212" class="ss">ដោយ MEF</text>
<line x1="740" y1="170" x2="753" y2="170" class="arw" marker-end="url(#caminvflowkm-hd)"/>
<rect x="768" y="118" width="214" height="104" rx="9" class="card"/>
<text x="786" y="145" class="num">៤</text>
<text x="786" y="174" class="st">វាត្រឡប់មកវិញ</text>
<text x="786" y="196" class="ss">ស្ថានភាព XML និង PDF</text>
<text x="786" y="212" class="ss">ផ្លូវការ លើកំណត់ត្រាដដែល</text>
<path d="M 875 226 L 875 262 L 131 262 L 131 234" class="arw" stroke-dasharray="6 5" marker-end="url(#caminvflowkm-hd)"/>
<text x="500" y="284" class="cap" text-anchor="middle">កំណត់ត្រាតែមួយផ្ទុកវិក្កយបត្រ អាករលើតម្លៃបន្ថែម ធាតុបញ្ជីគណនេយ្យ និងស្ថានភាពវិក្កយបត្រអេឡិចត្រូនិក</text>
<rect x="24" y="298" width="952" height="42" rx="6" class="noteBox"/>
<text x="44" y="324" class="noteTxt">ឯកសារដែលអ្នកផ្គត់ផ្គង់ផ្ញើមកអ្នក មកដល់តាមរបៀបដដែល — ទទួលយក ឬបដិសេធវានៅក្នុង វិធាន ដោយមិនចាំបាច់ចាកចេញពីបញ្ជីគណនេយ្យ។</text>
<text x="24" y="40" class="title">របៀបដែលវិក្កយបត្រអេឡិចត្រូនិកដំណើរការក្នុង វិធាន</text>
<text x="24" y="66" class="cap">បួនជំហាន ប្រព័ន្ធតែមួយ — CamInv ជាវេទិកាវិក្កយបត្រអេឡិចត្រូនិកថ្នាក់ជាតិកម្ពុជា គ្រប់គ្រងដោយក្រសួងសេដ្ឋកិច្ច និងហិរញ្ញវត្ថុ។</text>
