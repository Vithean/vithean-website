<svg class="figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="caminvflowkm-t caminvflowkm-d">
<title id="caminvflowkm-t">របៀបដែលវិក្កយបត្រអេឡិចត្រូនិកដំណើរការក្នុង វិធាន</title>
<desc id="caminvflowkm-d">បួនជំហាន។ មួយ៖ កត់ត្រាវិក្កយបត្រក្នុង វិធាន ដូចដែលអ្នកធ្វើស្រាប់។ ពីរ៖ វិធាន ផ្ញើវាទៅ CamInv ពីឯកសារដដែលនោះ។ បី៖ CamInv ដែលគ្រប់គ្រងដោយក្រសួងសេដ្ឋកិច្ច និងហិរញ្ញវត្ថុ ផ្ទៀងផ្ទាត់ និងអនុញ្ញាតវា។ បួន៖ ស្ថានភាព និងឯកសារ XML និង PDF ផ្លូវការ ត្រឡប់មកកំណត់ត្រាដដែល។ ឯកសារដែលអ្នកផ្គត់ផ្គង់ផ្ញើមក មកដល់តាមរបៀបដដែល ហើយអាចទទួលយក ឬបដិសេធនៅក្នុង វិធាន។</desc>
<style>
/* Scoped. An inlined SVG stylesheet is NOT sandboxed: without the
   svg.figure prefix these rules leak onto the page, where .band and
   .flow collide with the site's own classes.
   Do not write a style start-tag inside this comment. The HTML parser
   does not treat SVG stylesheet content as raw text, so a literal one
   opens a second element and every shape after it is swallowed into
   it — the figure then renders as an empty box. */

svg.figure .bg { fill: var(--surface); }
svg.figure .title { font: 600 19px var(--sans); fill: var(--ink-strong); }
svg.figure .card { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
svg.figure .cardGov { fill: var(--brass-tint); stroke: var(--brass); stroke-width: 1.5; }
svg.figure .num { font: 700 13px var(--sans); fill: var(--plum-600); }
svg.figure .numGov { font: 700 13px var(--sans); fill: var(--brass); }
svg.figure .st { font: 600 15px var(--sans); fill: var(--ink-strong); }
svg.figure .ss { font: 400 12.5px var(--sans); fill: var(--ink-muted); }
svg.figure .arw { stroke: var(--plum-600); stroke-width: 2.5; fill: none; }
svg.figure .hd { fill: var(--plum-600); }
svg.figure .noteBox { fill: var(--tint); }
svg.figure .noteTxt { font: 400 13px var(--sans); fill: var(--ink); }
svg.figure .cap { font: 400 12px var(--sans); fill: var(--ink-muted); }

</style>
<defs>
  <marker id="caminvflowkm-hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
