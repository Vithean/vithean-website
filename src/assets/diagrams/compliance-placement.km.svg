<svg class="figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="complianceplacementkm-figTitle complianceplacementkm-figDesc">
<title id="complianceplacementkm-figTitle">ការអនុលោមស្ថិតនៅត្រង់ណា</title>
<desc id="complianceplacementkm-figDesc">ផ្លូវពីរឆ្ពោះទៅវិក្កយបត្រកម្ពុជាដែលអនុលោម។ លើវេទិកាអន្តរជាតិធម្មតា កម្មវិធីគណនេយ្យបញ្ជូនទៅឧបករណ៍វិក្កយបត្រអេឡិចត្រូនិកដាច់ដោយឡែករបស់អ្នកផ្គត់ផ្គង់ផ្សេង មុននឹងទៅដល់ CamInv ហើយស្ថានភាពត្រូវផ្គូផ្គងត្រឡប់មកបញ្ជីគណនេយ្យដោយដៃ។ ចំណែក វិធាន វិញ វិក្កយបត្រ អាករលើតម្លៃបន្ថែម បញ្ជីគណនេយ្យ និងការភ្ជាប់ CamInv ស្ថិតក្នុងប្រព័ន្ធតែមួយ ហើយស្ថានភាព និងឯកសារ XML និង PDF ផ្លូវការ ត្រឡប់មកកំណត់ត្រាដដែល។</desc>
<style>
/* Scoped. An inlined SVG stylesheet is NOT sandboxed: without the
   svg.figure prefix these rules leak onto the page, where .band and
   .flow collide with the site's own classes.
   Do not write a style start-tag inside this comment. The HTML parser
   does not treat SVG stylesheet content as raw text, so a literal one
   opens a second element and every shape after it is swallowed into
   it — the figure then renders as an empty box. */


svg.figure .figBg { fill: var(--surface); }
svg.figure .figTitle { font: 600 20px var(--sans); fill: var(--ink-strong); }
svg.figure .panelTitle { font: 600 17px var(--sans); fill: var(--ink); }
svg.figure .panelTitleBrand { font: 600 17px var(--sans); fill: var(--plum-600); }
svg.figure .lbl { font: 500 15px var(--sans); fill: var(--ink-strong); }
svg.figure .lblBrand { font: 600 17px var(--sans); fill: var(--plum-600); }
svg.figure .lblGov { font: 600 15px var(--sans); fill: var(--brass); }
svg.figure .sub { font: 400 12.5px var(--sans); fill: var(--ink-muted); }
svg.figure .subGov { font: 400 11.5px var(--sans); fill: var(--brass); opacity: .85; }
svg.figure .band { font: 600 12.5px var(--sans); fill: var(--ink); }
svg.figure .bandBrand { font: 600 12.5px var(--sans); fill: var(--plum-600); }
svg.figure .bandSub { font: 400 11.5px var(--sans); fill: var(--ink-muted); }
svg.figure .caption { font: 400 12.5px var(--sans); fill: var(--ink-muted); }
svg.figure .panelA { fill: var(--tint); stroke: var(--line-strong); stroke-width: 1.5; }
svg.figure .panelB { fill: var(--plum-50); stroke: var(--plum-600); stroke-width: 1.5; }
svg.figure .boxNeutral { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
svg.figure .boxDashed { fill: none; stroke: var(--ink-muted); stroke-width: 1.5; }
svg.figure .boxBrand { fill: var(--surface); stroke: var(--plum-600); stroke-width: 2; }
svg.figure .boxGov { fill: var(--brass-tint); stroke: var(--brass); stroke-width: 1.5; }
svg.figure .divider { stroke: var(--line-strong); stroke-width: 1; }
svg.figure .bandA { fill: var(--line); }
svg.figure .bandB { fill: var(--plum-100); }
svg.figure .flow { stroke: var(--ink-muted); stroke-width: 2; fill: none; }
svg.figure .flowBrand { stroke: var(--plum-600); stroke-width: 2.5; fill: none; }
svg.figure .hInk { fill: var(--ink-muted); }
svg.figure .hBrand { fill: var(--plum-600); }


</style>
<defs>
  <marker id="complianceplacementkm-headInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" class="hInk"/>
  </marker>
  <marker id="complianceplacementkm-headMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" class="hInk"/>
  </marker>
  <marker id="complianceplacementkm-headBrand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" class="hBrand"/>
  </marker>
</defs>
