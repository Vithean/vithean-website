<rect x="588" y="456" width="384" height="56" rx="8" class="boxGov"/>
<text x="780" y="480" class="lblGov" text-anchor="middle">CamInv</text>
<text x="780" y="499" class="subGov" text-anchor="middle">ក្រសួងសេដ្ឋកិច្ច និងហិរញ្ញវត្ថុ</text>
