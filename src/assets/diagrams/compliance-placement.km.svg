<text x="780" y="340" class="lbl" text-anchor="middle">ការភ្ជាប់ CamInv មានស្រាប់ក្នុងប្រព័ន្ធ</text>
<text x="780" y="364" class="sub" text-anchor="middle">ប្រព័ន្ធតែមួយ · ចូលតែម្ដង · កំណត់ត្រាតែមួយ</text>
