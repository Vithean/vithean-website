<text x="780" y="250" class="lblBrand" text-anchor="middle">វិធាន</text>
<text x="780" y="274" class="sub" text-anchor="middle">វិក្កយបត្រ · អាករលើតម្លៃបន្ថែម · បញ្ជីគណនេយ្យ</text>
