<text x="260" y="553" class="band" text-anchor="middle">↑  ស្ថានភាពត្រឡប់មកដាច់ដោយឡែក</text>
<text x="260" y="570" class="bandSub" text-anchor="middle">ផ្គូផ្គងនឹងបញ្ជីគណនេយ្យដោយដៃ</text>
<rect x="588" y="532" width="384" height="48" rx="6" class="bandB"/>
<text x="780" y="553" class="bandBrand" text-anchor="middle">↑  ស្ថានភាពត្រឡប់ទៅកំណត់ត្រាដដែល</text>
<text x="780" y="570" class="bandSub" text-anchor="middle">ជាមួយ XML និង PDF ផ្លូវការ</text>
<text x="24" y="38" class="figTitle">ការអនុលោមស្ថិតនៅត្រង់ណា</text>
<text x="520" y="638" class="caption" text-anchor="middle">ផ្លូវទាំងពីរអាចបង្កើតវិក្កយបត្រអនុលោមបាន។ ភាពខុសគ្នាគឺថាមានប្រព័ន្ធប៉ុន្មានត្រូវយល់ស្របគ្នា — និងនរណាជាអ្នករក្សាឲ្យវាយល់ស្របគ្នា។</text>
